name: Check Umlauf
on:
  push:
    # Main pushes run this suite through the Pages workflow.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run check:boundary && npm test && npm run build && npm run check:budget
      # Runtime libraries are present on the hosted Ubuntu image. Avoid the
      # optional font downloads that stalled on the Ubuntu package mirror.
      - run: npx playwright install chromium
        timeout-minutes: 5
      # WebGL rendering shares the hosted runner's CPU; avoid competing scenes.
      - name: E2E tests
        id: e2e
        env:
          E2E_SUITE: Umlauf
        run: npm run test:browser -- --workers=1
      - name: Upload E2E report, screenshots and traces
        id: e2e-report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Link E2E report in run summary
        if: ${{ !cancelled() && steps.e2e-report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.e2e-report.outputs.artifact-url }}
        run: |
          printf '\n[Download E2E reports, screenshots and traces](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: umlauf-preview
          path: dist
          retention-days: 7

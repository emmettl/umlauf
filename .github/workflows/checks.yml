name: Check Umlauf
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run check:boundary && npm test && npm run build && npm run check:budget
      # Runtime libraries are present on the hosted Ubuntu image. Avoid the
      # optional font downloads that stalled on the Ubuntu package mirror.
      - run: npx playwright install chromium
        timeout-minutes: 5
      # WebGL rendering shares the hosted runner's CPU; avoid competing scenes.
      - run: npm run test:browser -- --workers=1
      - uses: actions/upload-artifact@v7
        with:
          name: umlauf-preview
          path: dist
          retention-days: 7

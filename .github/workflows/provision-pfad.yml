name: Provision PFAD deployment secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare
    steps:
      - run: python3 -m pip install --quiet PyNaCl==1.5.0
      - name: Seal deployment credential for PFAD only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_PUBLIC_KEY: qCgIkvofA2aqwEmrBRziRRQ1TkCNxXCAsk2KWImvPGc=
          TARGET_KEY_ID: 3380204578043523366
        run: |
          python3 - <<'PYTHON'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          token = os.environ['CF_TOKEN']
          if not token:
              raise SystemExit('Missing source deployment credential')
          box = SealedBox(PublicKey(base64.b64decode(os.environ['TARGET_PUBLIC_KEY'])))
          encrypted = base64.b64encode(box.encrypt(token.encode())).decode()
          with open('pfad-sealed.json', 'w') as handle:
              json.dump({'key_id': os.environ['TARGET_KEY_ID'], 'encrypted_value': encrypted}, handle)
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: pfad-sealed-deployment-credential
          path: pfad-sealed.json
          retention-days: 1
